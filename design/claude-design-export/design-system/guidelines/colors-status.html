<!-- @dsCard group="Colors" viewport="700x130" name="Status colors" subtitle="Green live · amber paused (the default problem color) · red off (rare)" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-canvas)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}.nm{font:var(--type-caption);color:var(--text-secondary);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hx{font:var(--type-code);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw" style="background:var(--status-live-bg);border-radius:var(--radius-lg);padding:12px"><div style="display:flex;align-items:center;gap:8px;font:var(--type-label);color:var(--status-live-text)"><span style="width:8px;height:8px;border-radius:999px;background:var(--status-live)"></span>기록 중</div><div style="font:var(--type-caption);color:var(--status-live-text);margin-top:4px;opacity:.85">Tiro 전사 · Meet 화면 · IntelliJ 코드</div><div class="hx" style="margin-top:8px">--status-live-bg / -text</div></div><div class="sw" style="background:var(--status-paused-bg);border-radius:var(--radius-lg);padding:12px"><div style="display:flex;align-items:center;gap:8px;font:var(--type-label);color:var(--status-paused-text)"><span style="width:8px;height:8px;border-radius:999px;background:var(--status-paused)"></span>일부 멈춤</div><div style="font:var(--type-caption);color:var(--status-paused-text);margin-top:4px;opacity:.85">Tiro 전사가 멈췄어요. 나머지는 계속 기록 중</div><div class="hx" style="margin-top:8px">--status-paused-bg / -text</div></div><div class="sw" style="background:var(--status-off-bg);border-radius:var(--radius-lg);padding:12px"><div style="display:flex;align-items:center;gap:8px;font:var(--type-label);color:var(--status-off-text)"><span style="width:8px;height:8px;border-radius:999px;background:var(--status-off)"></span>연결 끊김</div><div style="font:var(--type-caption);color:var(--status-off-text);margin-top:4px;opacity:.85">AI 연결을 기다리고 있어요</div><div class="hx" style="margin-top:8px">--status-off-bg / -text</div></div><div class="sw" style="background:var(--status-info-bg);border-radius:var(--radius-lg);padding:12px"><div style="display:flex;align-items:center;gap:8px;font:var(--type-label);color:var(--status-info-text)">안내</div><div style="font:var(--type-caption);color:var(--status-info-text);margin-top:4px;opacity:.85">저장한 순간은 기록에서 볼 수 있어요</div><div class="hx" style="margin-top:8px">--status-info-bg / -text</div></div></div></body></html>
