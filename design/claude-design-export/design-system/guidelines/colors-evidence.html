<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-canvas)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.nm{font:var(--type-caption);color:var(--text-secondary);margin-top:6px}.hx{font:var(--type-code);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row" style="gap:12px;align-items:flex-start"><div class="sw" style="display:flex;flex-direction:column;gap:8px"><span style="align-self:flex-start;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;background:var(--evidence-verified-bg);color:var(--evidence-verified-text);border:1px solid var(--evidence-verified-border);font:var(--type-caption);font-weight:500">확인됨 · 전사</span><span class="hx">--evidence-verified-bg / -text / -border</span><div class="nm" style="margin:0">자료에서 직접 읽었어요</div></div><div class="sw" style="display:flex;flex-direction:column;gap:8px"><span style="align-self:flex-start;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;background:var(--evidence-partial-bg);color:var(--evidence-partial-text);border:1px solid var(--evidence-partial-border);font:var(--type-caption);font-weight:500">일부 확인 · Meet 화면</span><span class="hx">--evidence-partial-bg / -text / -border</span><div class="nm" style="margin:0">일부만 보였어요</div></div><div class="sw" style="display:flex;flex-direction:column;gap:8px"><span style="align-self:flex-start;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;background:var(--evidence-inferred-bg);color:var(--evidence-inferred-text);border:1px dashed var(--evidence-inferred-border);font:var(--type-caption);font-weight:500">추론 · 테스트 이야기</span><span class="hx">--evidence-inferred-bg / -text / -border</span><div class="nm" style="margin:0">근거로 추측했어요</div></div><div class="sw" style="display:flex;flex-direction:column;gap:8px"><span style="align-self:flex-start;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;background:var(--evidence-delayed-bg);color:var(--evidence-delayed-text);border:1px solid var(--evidence-delayed-border);font:var(--type-caption);font-weight:500">자료 지연 · IntelliJ</span><span class="hx">--evidence-delayed-bg / -text / -border</span><div class="nm" style="margin:0">이 자료는 아직 못 봤어요</div></div></div></body></html>
