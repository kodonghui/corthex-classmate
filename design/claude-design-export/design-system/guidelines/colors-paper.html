<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-canvas)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}.nm{font:var(--type-caption);color:var(--text-secondary);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hx{font:var(--type-code);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--paper-0);"></div><div class="nm">--paper-0</div></div><div class="sw"><div class="chip" style="background:var(--paper-1);"></div><div class="nm">--paper-1</div></div><div class="sw"><div class="chip" style="background:var(--paper-2);"></div><div class="nm">--paper-2</div></div><div class="sw"><div class="chip" style="background:var(--paper-3);"></div><div class="nm">--paper-3</div></div><div class="sw"><div class="chip" style="background:var(--paper-4);"></div><div class="nm">--paper-4</div></div><div class="sw"><div class="chip" style="background:var(--paper-5);"></div><div class="nm">--paper-5</div></div></div></body></html>
