<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-canvas)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}.nm{font:var(--type-caption);color:var(--text-secondary);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hx{font:var(--type-code);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ink-50);"></div><div class="nm">--ink-50</div></div><div class="sw"><div class="chip" style="background:var(--ink-100);"></div><div class="nm">--ink-100</div></div><div class="sw"><div class="chip" style="background:var(--ink-200);"></div><div class="nm">--ink-200</div></div><div class="sw"><div class="chip" style="background:var(--ink-300);"></div><div class="nm">--ink-300</div></div><div class="sw"><div class="chip" style="background:var(--ink-400);"></div><div class="nm">--ink-400</div></div><div class="sw"><div class="chip" style="background:var(--ink-500);"></div><div class="nm">--ink-500</div></div><div class="sw"><div class="chip" style="background:var(--ink-600);"></div><div class="nm">--ink-600</div></div><div class="sw"><div class="chip" style="background:var(--ink-700);"></div><div class="nm">--ink-700</div></div><div class="sw"><div class="chip" style="background:var(--ink-800);"></div><div class="nm">--ink-800</div></div><div class="sw"><div class="chip" style="background:var(--ink-900);"></div><div class="nm">--ink-900</div></div></div></body></html>
