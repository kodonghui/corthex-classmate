<!-- @dsCard group="Elevation" viewport="700x140" name="Motion" subtitle="120/180/240ms · decelerating · no bounce · breathing dot for live states" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-canvas)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}.nm{font:var(--type-caption);color:var(--text-secondary);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hx{font:var(--type-code);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row" style="gap:20px;align-items:center"><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:8px;font:var(--type-label);color:var(--status-live-text)"><span style="width:8px;height:8px;border-radius:999px;background:var(--status-live);animation:cm-breathe var(--duration-breathe) var(--ease-in-out) infinite"></span>3교시 기록 중</div><span class="hx">cm-breathe · 2400ms</span></div><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div style="height:2px;background:var(--paper-4);border-radius:1px;overflow:hidden;position:relative"><div style="position:absolute;inset:0;width:40%;background:var(--ink-400);animation:cm-sweep 1400ms var(--ease-in-out) infinite"></div></div><span class="hx">cm-sweep · 설명 준비 중</span></div><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:8px 10px;font:var(--type-label);animation:cm-fade-in var(--duration-base) var(--ease-enter) both">저장했어요</div><span class="hx">cm-fade-in · 180ms · +4px rise</span></div><div class="sw" style="font:var(--type-caption);color:var(--text-tertiary);display:flex;flex-direction:column;gap:4px"><span>fast 120 · base 180 · slow 240</span><span>ease-out .2,.7,.2,1</span><span>ease-enter .1,.8,.2,1</span><span>reduced-motion → 0ms</span></div></div></body></html>
