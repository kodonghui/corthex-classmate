<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-canvas)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}.nm{font:var(--type-caption);color:var(--text-secondary);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hx{font:var(--type-code);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="display:flex;align-items:center;justify-content:center;padding:0 10px;text-align:center;background:var(--paper-0);color:var(--text-1);font:var(--type-label)">본문 · 결론 · 제목</div><div class="nm">--text-1</div></div><div class="sw"><div class="chip" style="display:flex;align-items:center;justify-content:center;padding:0 10px;text-align:center;background:var(--paper-0);color:var(--text-2);font:var(--type-label)">보조 설명</div><div class="nm">--text-2</div></div><div class="sw"><div class="chip" style="display:flex;align-items:center;justify-content:center;padding:0 10px;text-align:center;background:var(--paper-0);color:var(--text-3);font:var(--type-label)">메타 · 14:02 · 3교시</div><div class="nm">--text-3</div></div><div class="sw"><div class="chip" style="display:flex;align-items:center;justify-content:center;padding:0 10px;text-align:center;background:var(--paper-0);color:var(--text-4);font:var(--type-label)">비활성 · 플레이스홀더</div><div class="nm">--text-4</div></div><div class="sw"><div class="chip" style="display:flex;align-items:center;justify-content:center;padding:0 10px;text-align:center;background:var(--ink-600);color:var(--text-on-accent);font:var(--type-label)">강조 위 텍스트</div><div class="nm">--text-on-accent</div></div></div></body></html>
