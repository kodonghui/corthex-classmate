<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-canvas)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}.nm{font:var(--type-caption);color:var(--text-secondary);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hx{font:var(--type-code);font-size:11px;color:var(--text-tertiary)}</style></head><body><div style="background:var(--code-bg);border-radius:var(--radius-lg);padding:12px 14px;font:var(--type-code);color:var(--code-text)"><span style="color:var(--code-comment)">// 객체 없이 바로 호출</span><br><span style="color:var(--code-keyword)">public static</span> <span style="color:var(--code-type)">int</span> add(<span style="color:var(--code-type)">int</span> a, <span style="color:var(--code-type)">int</span> b) { <span style="color:var(--code-keyword)">return</span> a + b; }<br><span style="color:var(--code-type)">String</span> name = <span style="color:var(--code-string)">"Spring"</span>; <span style="color:var(--code-type)">int</span> port = <span style="color:var(--code-number)">8080</span>;</div><div class="row" style="margin-top:10px"><div class="sw" style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--code-keyword)"></span><span class="hx">--code-keyword</span></div><div class="sw" style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--code-type)"></span><span class="hx">--code-type</span></div><div class="sw" style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--code-string)"></span><span class="hx">--code-string</span></div><div class="sw" style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--code-number)"></span><span class="hx">--code-number</span></div><div class="sw" style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--code-comment)"></span><span class="hx">--code-comment</span></div></div></body></html>
