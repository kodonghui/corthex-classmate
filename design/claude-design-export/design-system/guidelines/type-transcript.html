<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-canvas)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.nm{font:var(--type-caption);color:var(--text-secondary);margin-top:6px}.hx{font:var(--type-code);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row" style="gap:24px;align-items:flex-end"><div style="width:340px;display:flex;flex-direction:column;gap:20px"><p style="margin:0;font:var(--type-transcript);letter-spacing:var(--text-transcript-ls);color:var(--transcript-3);word-break:keep-all">지금까지는 필요한 객체를 <u style="text-decoration:none;border-bottom:1.5px dotted var(--term-underline-faded)">new</u>로 만들어 썼습니다.</p><p style="margin:0;font:var(--type-transcript);letter-spacing:var(--text-transcript-ls);color:var(--transcript-1);word-break:keep-all">객체를 직접 <u style="text-decoration:none;border-bottom:1.5px solid var(--ink-600);background:var(--term-active-bg);padding:0 4px;border-radius:3px 3px 0 0;color:var(--term-active-text)">new</u>로 만들면 클래스끼리 <u style="text-decoration:none;border-bottom:1.5px dotted var(--term-underline)">강하게 묶입니다</u>.</p></div><div style="flex:1;font:var(--type-caption);color:var(--text-tertiary);display:flex;flex-direction:column;gap:6px"><span>font: var(--type-transcript) · 19px / 31px · 400</span><span>letter-spacing: −0.012em · keep-all</span><span>color: --transcript-1 → -2 → -3 by age</span><span>term: 1.5px dotted --term-underline</span><span>caught: --term-active-bg + solid --ink-600</span><span>≈ 15–17 글자 per line at 380px</span></div></div></body></html>
