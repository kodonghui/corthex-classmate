<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-canvas)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}.nm{font:var(--type-caption);color:var(--text-secondary);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hx{font:var(--type-code);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row" style="gap:12px"><div class="sw"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-xs)"></div><div class="nm">--radius-xs · 3px</div><div class="hx">inline code</div></div><div class="sw"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-sm)"></div><div class="nm">--radius-sm · 4px</div><div class="hx">chips, tags</div></div><div class="sw"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-md)"></div><div class="nm">--radius-md · 6px</div><div class="hx">buttons, inputs</div></div><div class="sw"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-lg)"></div><div class="nm">--radius-lg · 8px</div><div class="hx">cards, code blocks</div></div><div class="sw"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-xl)"></div><div class="nm">--radius-xl · 12px</div><div class="hx">dialog, banner</div></div><div class="sw"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-full)"></div><div class="nm">--radius-full · 999</div><div class="hx">dots, pills</div></div></div></body></html>
