<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-canvas)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}.nm{font:var(--type-caption);color:var(--text-secondary);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hx{font:var(--type-code);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row" style="gap:24px"><p style="margin:0;flex:1;font:var(--type-body);letter-spacing:var(--text-body-ls);word-break:keep-all">선생님이 IntelliJ에서 보여준 <code style="background:var(--code-bg);padding:1px 5px;border-radius:3px">@Autowired</code>는 Spring이 필요한 객체를 대신 넣어 주는 표시예요. 직접 <code style="background:var(--code-bg);padding:1px 5px;border-radius:3px">new</code>로 만들지 않아도 돼서 코드가 짧아져요.</p><div style="width:220px;font:var(--type-caption);color:var(--text-tertiary);display:flex;flex-direction:column;gap:4px"><span>font: var(--type-body)</span><span>letter-spacing: var(--text-body-ls)</span><span>word-break: keep-all</span><span>overflow-wrap: anywhere</span><span>max line ≈ 22–26 글자 at 380px</span></div></div></body></html>
