<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-canvas)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}.nm{font:var(--type-caption);color:var(--text-secondary);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hx{font:var(--type-code);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row" style="gap:16px;align-items:flex-start"><div class="sw" style="display:flex;flex-direction:column;gap:8px"><div style="font:var(--type-label);color:var(--text-secondary)">버튼은 학습자의 말</div><div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:8px 10px;font:var(--type-body);color:var(--text-body)"><span style="color:var(--status-live-text);font-weight:700;margin-right:6px">O</span>지금 막혔어요 · 수업으로 돌아가기 · 더 쉽게 · 예시 더</div><div style="background:var(--surface-sunken);border-radius:var(--radius-md);padding:8px 10px;font:var(--type-body);color:var(--text-tertiary);text-decoration:line-through"><span style="color:var(--status-off-text);font-weight:700;margin-right:6px;text-decoration:none;display:inline-block">X</span>제출 · 전송 · 확인하기 · 질문하기</div></div><div class="sw" style="display:flex;flex-direction:column;gap:8px"><div style="font:var(--type-label);color:var(--text-secondary)">결론 한 문장 먼저</div><div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:8px 10px;font:var(--type-body);color:var(--text-body)"><span style="color:var(--status-live-text);font-weight:700;margin-right:6px">O</span>static은 객체 없이 클래스에서 바로 쓰는 멤버예요.</div><div style="background:var(--surface-sunken);border-radius:var(--radius-md);padding:8px 10px;font:var(--type-body);color:var(--text-tertiary);text-decoration:line-through"><span style="color:var(--status-off-text);font-weight:700;margin-right:6px;text-decoration:none;display:inline-block">X</span>static 키워드에 대해 설명드리겠습니다. 먼저…</div></div><div class="sw" style="display:flex;flex-direction:column;gap:8px"><div style="font:var(--type-label);color:var(--text-secondary)">멈춘 것 → 계속되는 것</div><div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:8px 10px;font:var(--type-body);color:var(--text-body)"><span style="color:var(--status-live-text);font-weight:700;margin-right:6px">O</span>Tiro 전사가 멈췄어요. Meet 화면과 코드는 계속 기록하고 있어요.</div><div style="background:var(--surface-sunken);border-radius:var(--radius-md);padding:8px 10px;font:var(--type-body);color:var(--text-tertiary);text-decoration:line-through"><span style="color:var(--status-off-text);font-weight:700;margin-right:6px;text-decoration:none;display:inline-block">X</span>오류가 발생했습니다! 연결을 확인해 주세요.</div></div></div></body></html>
