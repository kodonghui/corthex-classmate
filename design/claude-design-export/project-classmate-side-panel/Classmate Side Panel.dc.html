    const tip = tiro
      ? el('span', null, '전사가 멈춘 동안에도 ', this.kbd('Alt'), '+', this.kbd('S'), '로 지금 화면과 코드를 붙잡을 수 있어요')
      : el('span', null, '걸리는 말을 누르세요 · 문장을 누르면 문장 전체를 붙잡아요 · ', this.kbd('Alt'), '+', this.kbd('S'), ' 마지막 문장');

    return {
      panelRef: this.panelRef, bodyRef: this.bodyRef,
      panelW: w + 'px', inset: ({ 360: '14px', 380: '16px', 520: '20px' })[w] || '16px',
      screenLabel: ({ home: '듣는 중', detail: '자세히', history: '기록', settings: '설정' })[s.screen],
      isHome: s.screen === 'home', isDetail: s.screen === 'detail' && !!cur, isHistory: s.screen === 'history', isSettings: s.screen === 'settings',
      // 듣는 중
      headerStatus: tiro ? 'paused' : 'live', clockText: Component.fmt(s.clock),
      settingsAction: ns.IconButton ? el(ns.IconButton, { icon: 'settings-2', label: '설정', size: 'sm', onClick: this.openSettings }) : null,
      lines: visible, active: act ? act.segKey : null, marked: s.moments.filter(m => m.segKey).map(m => m.segKey),
      onTerm: this.catchTerm, onSentence: this.catchSentence, renderAfter: this.renderAfter, tip,
      sources: [{ key: 'tiro', state: tiro ? 'paused' : 'live', ago: tiro ? '멈춤' : '4초 전' }, { key: 'meet', ago: '2초 전' }, { key: 'intellij', ago: '1초 전' }],
      count: caught.length, openHistory: this.openHistory,
      warn: ai ? { tone: 'off', title: '튜터 답변이 잠시 멈췼어요.', description: '수업 기록과 질문 지점은 계속 저장하고 있어요.' }
        : tiro ? { title: '전사가 잠시 멈췼어요.', description: '화면과 코드는 계속 기록하고 있어요.', action: '다시 연결', onAction: this.reconnect } : null,
      // 자세히
      goHome: this.goHome,
      curTerm: cur ? (cur.term || '문장') : '', curSubtitle: cur ? (earlier ? `${cur.time} 붙잡음 · ${cur.period}` : `${cur.time} 붙잡음`) : '',
      hasCurLine: !!curLine, curLines: curLine ? [curLine] : [], curMarked: cur && cur.segKey ? [cur.segKey] : [],
      curReady, curWaiting: !!cur && !curReady, waitText: ai ? '튜터가 돌아오면 여기에 나타나요 · 순간은 저장됐어요' : '한 줄로 정리하고 있어요',
      curConclusion: ans ? ans.conclusion : '', curEvidence: ans ? ans.evidence : [], curSections: sections,
      followUps: curReady && !earlier ? [{ id: 'easier', label: '더 쉽게' }, { id: 'why', label: '왜 필요한데?' }, { id: 'recent', label: '방금 내용' }] : [],
      onFollowUp: this.onFollowUp,
      hasReply: !!reply, replyQ: reply ? reply.q : '', replyA: reply ? (reply.pending ? '한 줄로 정리하고 있어요' : reply.a) : '', replyDone: !!reply && !reply.pending, replyEvidence: reply ? reply.ev : {},
      typed: s.typed, onTyped: this.onTyped, onTypedKey: this.onTypedKey,
      nowText: nowL ? `선생님은 지금 ${nowL.now}` : last ? `지금 · ${Component.text(last)}` : '',
      hasNowTop: !!nowL, nowTop: nowL ? `지금 · ${nowL.now}` : '',
      // 기록
      historySubtitle: `오늘 ${today.length + D.EARLIER.length}개`, groups,
      recordingSources: [{ key: 'tiro', ago: '기록 중' }, { key: 'meet', ago: '기록 중' }, { key: 'intellij', ago: '기록 중' }],
      // 설정
      answerLen: len, setAnswerLen: this.setAnswerLen,
      lenOptions: [{ value: 'short', label: '한 줄만 먼저', description: '자세한 내용은 눌러서 봐요' }, { value: 'full', label: '바로 자세히', description: '근거와 코드까지 처음부터 펼쳐요' }],
      autoFold: fold, onAutoFold: this.onAutoFold, altS: s.altS, onAltS: this.onAltS, fullWidth: { style: { width: '100%' } },
      askClear: this.askClear, closeClear: this.closeClear, doClear: this.doClear, confirmClear: s.confirmClear,
      clearDesc: `붙잡은 ${caught.length}개 순간이 사라져요. 되돌릴 수 없어요.`,
      // 시연
      restart: this.restart,
    };
  }
}
</script>
</body>
</html>
